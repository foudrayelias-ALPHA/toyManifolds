[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas1"
version = "0.1.0"
description = "ATLAS-1: manifold featurizer — a dictionary of charts, not directions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Elias Foudray" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
topology = [
  "ripser>=0.6",
  "persim>=0.3",
  "dreimac>=0.2",
  "giotto-tda>=0.6",
  "scikit-dimension>=0.3",
]
stage1 = [
  "transformer-lens>=2.0",
]
demo = [
  "ipywidgets>=8.0",
  "jupyter>=1.0",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas1*", "testbeds*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
