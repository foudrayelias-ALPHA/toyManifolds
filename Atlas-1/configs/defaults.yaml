  num_groups: 64
  total_latents: 1024
  snr_db: [5, 10, 15]

stage1:
  num_groups: 32
  total_latents: 512
  site: resid_post

lambda_g_sweep: [1.0e-3, 3.0e-3, 1.0e-2, 3.0e-2, 1.0e-1]
